name: CI

on:
  push:
    branches:
      - main
  pull_request:
jobs:
  test:
    name: "Tests using Node ${{ matrix.node_version }} on ${{ matrix.platform }}"
    strategy:
      fail-fast: false
      matrix:
        node_version: [22, 24, 26]
        platform:
          - ubuntu-latest
          - windows-latest
    runs-on: ${{matrix.platform}}
    steps:
      - uses: actions/checkout@main
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-deps
        with:
          node-version: ${{ matrix.node_version }}

      - name: Run Tests
        run: pnpm exec cross-env CI=true jest --coverage --color

      - name: Upload coverage to Codecov
        run: bash <(curl -s https://codecov.io/bash) -C $GITHUB_SHA -B ${GITHUB_REF#refs/heads/} -Z
        if: ${{ matrix.platform == 'ubuntu-latest' && matrix.node_version == 24 && always() }}
        env:
          CODECOV_TOKEN: dc4ed93e-11a9-421e-b141-8a2f11913593
  typescript:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@main

      - uses: ./.github/actions/setup-deps

      - name: Check Types
        run: pnpm exec tsc
  eslint:
    name: ESLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@main

      - uses: ./.github/actions/setup-deps

      - name: Run ESLint
        run: pnpm lint
  knip:
    name: Knip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@main

      - uses: ./.github/actions/setup-deps

      - name: Run Knip
        run: pnpm lint:knip
  build_site:
    name: Build Site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@main

      - uses: ./.github/actions/setup-deps

      - name: Build Site
        run: pnpm build:site
